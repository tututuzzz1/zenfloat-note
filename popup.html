<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 180px;
      margin: 0;
      padding: 12px;
      background: #000;
      color: #fff;
      font-family: 'SFMono-Regular', Consolas, monospace;
      text-align: center;
    }
    .brand { font-size: 10px; letter-spacing: 2px; margin-bottom: 12px; color: #666; }
    button {
      background: #111;
      color: #fff;
      border: 1px solid #333;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover { background: #222; border-color: #555; }
  </style>
</head>
<body>
  <div class="brand">ZENFLOAT v1.0.9</div>
  <button id="launch">LAUNCH NOTE</button>
  <script src="popup.js"></script>
</body>
</html>
