<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ZenFloat Note</title>
</head>
<body>
  <div class="zen-container">
    <header class="zen-header">
      <div class="brand">ZENFLOAT v1.0.18</div>
      <div class="actions">
        <button id="fold-btn" title="Fold/Unfold">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14h6v6M20 10h-6V4"></path></svg>
        </button>
        <button id="capture-btn" title="Toggle Theme">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </button>
        <button id="export-btn" title="Export Note">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
      </div>
    </header>
    <main class="zen-editor-wrapper">
      <div id="editor" contenteditable="true" spellcheck="false" placeholder="Start typing..."></div>
    </main>
    <footer class="zen-footer">
      <span id="status">READY</span>
      <span id="char-count">0 CHARS</span>
    </footer>
  </div>
</body>
</html>
